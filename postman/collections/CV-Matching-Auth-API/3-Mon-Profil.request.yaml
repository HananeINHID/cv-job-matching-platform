$kind: http-request
name: '3. Mon Profil'
method: GET
url: '{{base_url}}/api/profile/me/'
order: 3000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response contains personal_info", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("personal_info");
      });
    language: text/javascript
